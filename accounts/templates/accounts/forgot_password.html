<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Сброс пароля</title></head>
<body>
    <h2>Забыли пароль?</h2>
    <p>Введите ваш email, и мы отправим ссылку для сброса.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить</button>
    </form>
    <a href="{% url 'login' %}">Вернуться на страницу входа</a>
</body>
</html>
